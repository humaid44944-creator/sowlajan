<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة إدارة صولجان</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: Tajawal, Tahoma, sans-serif; background: #120F0C; color: #F4EEE1; margin: 0; padding: 20px; font-size: 16px; }
  h1 { font-family: Amiri, serif; color: #D9BC80; }
  .box { background: #1C1814; border: 1px solid #3A3229; padding: 18px; margin: 14px 0; max-width: 640px; }
  label { display: grid; gap: 6px; margin-bottom: 12px; color: #A89C86; font-size: 15px; }
  input, select, textarea { background: #120F0C; color: #F4EEE1; border: 1px solid #3A3229; padding: 10px; font: inherit; width: 100%; box-sizing: border-box; }
  button { background: #C9A45C; color: #120F0C; border: 0; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; margin-top: 6px; }
  button:disabled { opacity: .5; }
  button.del { background: #5a2a20; color: #F4EEE1; margin: 0; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid #3A3229; padding: 8px 0; }
  .msg { color: #E39A8A; min-height: 1.4em; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<h1>لوحة إدارة صولجان</h1>

<div class="box" id="loginBox">
  <label>الإيميل<input type="email" id="email" dir="ltr" autocomplete="username"></label>
  <label>كلمة السر<input type="password" id="pass" dir="ltr" autocomplete="current-password"></label>
  <p class="msg" id="loginMsg"></p>
  <button id="loginBtn">دخول</button>
</div>

<div id="panel" class="hidden">
  <div class="box">
    <label>نوع العرض
      <select id="type"><option value="sale">للبيع</option><option value="rent">للتأجير</option></select>
    </label>
    <label>اسم المنتج<input id="name"></label>
    <label>التصنيف<input id="cat" placeholder="مثال: ملابس، عطور، إكسسوارات"></label>
    <label id="priceWrap">السعر (ر.ع.)<input id="price" type="number" step="0.001" min="0"></label>
    <label id="oldWrap">السعر القديم المشطوب (اختياري)<input id="old" type="number" step="0.001" min="0"></label>
    <label id="dayWrap" class="hidden">سعر اليوم (ر.ع.)<input id="day" type="number" step="0.001" min="0"></label>
    <label>الوصف<textarea id="desc" rows="2"></textarea></label>
    <label>الشارة (اختياري)<input id="tag" placeholder="عرض / وصل حديثا / باقي قطعة"></label>
    <label>الصورة<input id="photo" type="file" accept="image/*"></label>
    <p class="msg" id="addMsg"></p>
    <button id="addBtn">إضافة المنتج</button>
  </div>

  <div class="box">
    <h3>المنتجات</h3>
    <div id="list"></div>
  </div>
  <button id="logoutBtn">خروج</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const ADMIN = "mounther2000@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

$("type").addEventListener("change", () => {
  const rent = $("type").value === "rent";
  $("priceWrap").classList.toggle("hidden", rent);
  $("oldWrap").classList.toggle("hidden", rent);
  $("dayWrap").classList.toggle("hidden", !rent);
});

$("loginBtn").onclick = async () => {
  $("loginMsg").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (e) { $("loginMsg").textContent = "الإيميل أو كلمة السر غير صحيحة."; }
};
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  const ok = !!user && user.email === ADMIN;
  $("loginBox").classList.toggle("hidden", ok);
  $("panel").classList.toggle("hidden", !ok);
  if (user && !ok) { $("loginMsg").textContent = "هذا الحساب غير مصرح له."; await signOut(auth); }
  if (ok) await loadList();
});

function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 700 / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", 0.78));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

$("addBtn").onclick = async () => {
  const m = $("addMsg");
  m.textContent = "";
  const type = $("type").value;
  const name = $("name").value.trim();
  if (!name) { m.textContent = "اكتب اسم المنتج."; return; }
  const data = {
    type, name,
    cat: $("cat").value.trim() || "أخرى",
    desc: $("desc").value.trim(),
    tag: $("tag").value.trim(),
    createdAt: serverTimestamp()
  };
  if (type === "rent") {
    data.day = Number($("day").value);
    if (!(data.day > 0)) { m.textContent = "أدخل سعر اليوم."; return; }
  } else {
    if ($("price").value === "") { m.textContent = "أدخل السعر."; return; }
    data.price = Number($("price").value);
    const old = Number($("old").value);
    if ($("old").value !== "" && old > data.price) data.old = old;
  }
  const file = $("photo").files[0];
  if (file) {
    m.textContent = "جاري تجهيز الصورة...";
    try { data.img = await compress(file); }
    catch (e) { m.textContent = "تعذّر قراءة الصورة."; return; }
  }
  $("addBtn").disabled = true;
  try {
    await addDoc(collection(db, "products"), data);
    m.textContent = "تمت الإضافة.";
    ["name", "cat", "price", "old", "day", "desc", "tag"].forEach(i => $(i).value = "");
    $("photo").value = "";
    await loadList();
  } catch (e) {
    m.textContent = "تعذّر الحفظ: " + e.message;
  } finally {
    $("addBtn").disabled = false;
  }
};

async function loadList() {
  const snap = await getDocs(query(collection(db, "products"), orderBy("createdAt", "desc")));
  $("list").innerHTML = "";
  snap.forEach(d => {
    const x = d.data();
    const row = document.createElement("div");
    row.className = "item";
    const info = document.createElement("div");
    info.textContent = x.name + " — " + (x.type === "rent" ? "تأجير " + x.day + " ر.ع./يوم" : x.price + " ر.ع.");
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "حذف";
    del.onclick = async () => {
      if (!confirm("حذف " + x.name + "؟")) return;
      await deleteDoc(doc(db, "products", d.id));
      await loadList();
    };
    row.append(info, del);
    $("list").append(row);
  });
}
</script>
</body>
</html>
